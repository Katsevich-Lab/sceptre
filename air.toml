# Air is the single R formatter; BiocCheck remains a separate checker.
# https://posit-dev.github.io/air/
# Width is preferred, not a guarantee for strings, URLs or comments.
[format]
indent-width = 4
line-width = 80
default-exclude = true
# Keep immutable fixtures and tooling/evidence outside formatting scope.
# Default exclusions also protect generated RcppExports.R bindings.
exclude = ["/tests/testthat/fixtures/", "/tools/"]
