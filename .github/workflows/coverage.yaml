name: Installed-package coverage
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      MAKEFLAGS: -j2
      NOT_CRAN: 'true'
      SCEPTRE_REQUIRE_NATIVE_COVERAGE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Native and backed system dependencies
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev libcurl4-openssl-dev libxml2-dev libssl-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::jsonlite
            any::xml2
            any::remotes
      - name: Install qualified optional backed runtime
        shell: Rscript {0}
        run: |
          pin <- "589803edea2a66ad15e7f07186bee16c7739ab8c"
          remotes::install_github(paste0("timothy-barry/ondisc@", pin),
            dependencies = FALSE, upgrade = "never")
          stopifnot(identical(utils::packageDescription("ondisc")$RemoteSha, pin))
      - name: Measure installed R and native coverage
        shell: bash
        run: |
          set -o pipefail
          Rscript --vanilla tools/coverage/measure.R . "$RUNNER_TEMP/coverage" 2>&1 | tee "$RUNNER_TEMP/coverage.log"
      - name: Summarize measured evidence
        if: success()
        shell: Rscript {0}
        run: |
          x <- jsonlite::read_json(file.path(Sys.getenv("RUNNER_TEMP"), "coverage", "summary.json"))
          text <- c("### Installed-package coverage", paste("Source:", x$commit),
            "Download the coverage artifact and open index.html for annotated source; summary.json records scope and input hashes.",
            vapply(names(x$totals), function(k) {
              z <- x$totals[[k]][[1L]]
              sprintf("- %s executable lines: %.2f%% (%s/%s)", k, z$percent, z$covered, z$executable)
            }, character(1)), "Line coverage is not branch coverage or scientific validation.")
          cat(paste(text, collapse = "\n"), "\n", file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
      - name: Retain browsable reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/coverage.log
            ${{ runner.temp }}/coverage/index.html
            ${{ runner.temp }}/coverage/*.json
            ${{ runner.temp }}/coverage/*.csv
            ${{ runner.temp }}/coverage/*.xml
            ${{ runner.temp }}/coverage/*.svg
            ${{ runner.temp }}/coverage/*.rds
            ${{ runner.temp }}/coverage/session-info.txt
            ${{ runner.temp }}/coverage/library/sceptre/tests/*.Rout*
