# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, dev, codex/refactor]
  pull_request:

name: R-CMD-check

jobs:
  R-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: posit-dev/setup-air@v1
        with:
          version: '0.9.0'
      - name: Check handwritten R formatting
        run: air format --check R

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      SCEPTRE_REQUIRE_ONDISC: ${{ matrix.config.os == 'macOS-latest' && 'true' || 'false' }}
      SCEPTRE_REFACTOR_ORACLE_DEBUG: 'false'
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1

    steps:
      - uses: actions/checkout@v2

      - name: Install system dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential libhdf5-dev libcurl4-openssl-dev libxml2-dev libssl-dev
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew update
            brew install hdf5 curl libxml2 openssl@3
            OPENSSL_PREFIX="$(brew --prefix openssl@3)"
            echo "LIBRARY_PATH=${OPENSSL_PREFIX}/lib" >> "$GITHUB_ENV"
            echo "CPATH=${OPENSSL_PREFIX}/include" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            # Rtools provides build toolchain + headers; Rhdf5lib brings HDF5
            # via setup-r-dependencies resolution. No apt/brew analogue needed.
            echo "No system dependencies to install on Windows; Rtools handles it."
          else
            echo "Unsupported OS: $RUNNER_OS"
            exit 1
          fi

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Prepare ondisc build dependencies (macOS only)
        if: ${{ matrix.config.os == 'macOS-latest' }}
        run: |
          Rscript -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
          Rscript -e "install.packages('BiocManager')"
          Rscript -e "BiocManager::install('Rhdf5lib', type = 'source')"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgload
            any::digest

      - name: Install verified ondisc source with pair-iteration bounds guard
        shell: Rscript {0}
        run: |
          pin <- "589803edea2a66ad15e7f07186bee16c7739ab8c"
          if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")
          installed <- if (nzchar(system.file(package = "ondisc")))
            utils::packageDescription("ondisc")$RemoteSha else NULL
          if (!identical(installed, pin)) {
            remotes::install_github(paste0("timothy-barry/ondisc@", pin),
              dependencies = FALSE, upgrade = "never")
          }
          stopifnot(identical(utils::packageDescription("ondisc")$RemoteSha, pin))

      - name: Build verified original-package workflow reference
        run: Rscript --vanilla tools/refactor/prepare-runtime-oracle.R

      - name: Check independent private native components
        run: Rscript --vanilla tools/refactor/test-native-components.R .

      - name: Check draw-bank ownership at R error boundaries
        run: Rscript --vanilla tools/refactor/test-sampling-ownership.R .

      - name: Check count ownership at R and native error boundaries
        run: Rscript --vanilla tools/refactor/test-count-ownership.R .

      - name: Check dispersion exception state and platform policy
        run: Rscript --vanilla tools/refactor/test-dispersion-exceptions.R .

      - name: Check native result ownership at R return boundaries
        shell: Rscript {0}
        run: |
          reference <- Sys.getenv("SCEPTRE_REFACTOR_ORIGINAL_SOURCE")
          stopifnot(nzchar(reference))
          status <- system2(file.path(R.home("bin"), "Rscript"), c("--vanilla",
            shQuote("tools/refactor/test-result-ownership.R"), shQuote(normalizePath(".")),
            shQuote(reference), shQuote(file.path(Sys.getenv("RUNNER_TEMP"), "sceptre-result-ownership"))))
          stopifnot(identical(status, 0L))

      - name: Retain native boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-boundaries-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: |
            ${{ runner.temp }}/sceptre-sampling-ownership
            ${{ runner.temp }}/sceptre-count-ownership
            ${{ runner.temp }}/sceptre-dispersion-exceptions
            ${{ runner.temp }}/sceptre-result-ownership

      - uses: r-lib/actions/check-r-package@v2

  in-memory-without-ondisc:
    runs-on: ubuntu-latest
    env:
      SCEPTRE_REFACTOR_ORACLE_DEBUG: 'true'
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
    steps:
      - uses: actions/checkout@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::pkgload
            any::R.utils
            any::MASS
            any::digest
      - name: Build verified original-package reference without ondisc
        run: Rscript --vanilla tools/refactor/prepare-runtime-oracle.R
      - name: Check independent private native components
        run: Rscript --vanilla tools/refactor/test-native-components.R .
      - name: Check draw-bank ownership at R error boundaries
        run: Rscript --vanilla tools/refactor/test-sampling-ownership.R .
      - name: Check count ownership at R and native error boundaries
        run: Rscript --vanilla tools/refactor/test-count-ownership.R .
      - name: Check dispersion exception state and platform policy
        run: Rscript --vanilla tools/refactor/test-dispersion-exceptions.R .
      - name: Check native result ownership at R return boundaries
        shell: Rscript {0}
        run: |
          reference <- Sys.getenv("SCEPTRE_REFACTOR_ORIGINAL_SOURCE")
          stopifnot(nzchar(reference))
          status <- system2(file.path(R.home("bin"), "Rscript"), c("--vanilla",
            shQuote("tools/refactor/test-result-ownership.R"), shQuote(normalizePath(".")),
            shQuote(reference), shQuote(file.path(Sys.getenv("RUNNER_TEMP"), "sceptre-result-ownership"))))
          stopifnot(identical(status, 0L))
      - name: Retain native boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-boundaries-without-ondisc
          path: |
            ${{ runner.temp }}/sceptre-sampling-ownership
            ${{ runner.temp }}/sceptre-count-ownership
            ${{ runner.temp }}/sceptre-dispersion-exceptions
            ${{ runner.temp }}/sceptre-result-ownership
      - name: Require an ondisc-free environment and run package tests
        shell: Rscript {0}
        run: |
          stopifnot(!requireNamespace("ondisc", quietly = TRUE))
          candidate_library <- tempfile("sceptre-installed-")
          dir.create(candidate_library)
          status <- system2(file.path(R.home("bin"), "R"), c("CMD", "INSTALL",
            "--preclean", paste0("--library=", shQuote(candidate_library)), "."))
          stopifnot(identical(status, 0L))
          .libPaths(c(candidate_library, .libPaths()))
          library(sceptre)
          stopifnot(identical(normalizePath(find.package("sceptre")),
            normalizePath(file.path(candidate_library, "sceptre"))),
            file.exists(file.path(find.package("sceptre"), "Meta", "package.rds")),
            !requireNamespace("ondisc", quietly = TRUE))
          testthat::test_dir("tests/testthat", package = "sceptre",
            load_package = "installed", reporter = "summary", stop_on_failure = TRUE)
