# Frozen behavior suite (tools/consistency): checks that sceptre reproduces the
# outputs recorded from the reference commit. It is a developer lane, separate
# from R CMD check, and runs on pull requests or when started by hand.
#
# Cross-platform policy (tools/consistency/README.md): the fixtures were
# recorded on macOS arm64 with R 4.6.0 (see fixtures/manifest.json). macOS runs
# that R version at the strict tier and must pass. Linux runs the portable tier
# and is informational until it has passed here.
on:
  pull_request:
  workflow_dispatch:

name: frozen-behavior

permissions:
  contents: read

jobs:
  frozen-behavior:
    runs-on: ${{ matrix.config.os }}

    name: frozen behavior (${{ matrix.config.os }}, ${{ matrix.config.tier }})

    continue-on-error: ${{ matrix.config.informational }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, tier: strict, informational: false}
          - {os: ubuntu-latest, tier: portable, informational: true}

    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Keep equal to environment.R in tools/consistency/fixtures/manifest.json.
          r-version: '4.6.0'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::withr
            any::jsonlite

      - name: Install sceptre
        run: |
          mkdir -p "$RUNNER_TEMP/sceptre-library"
          R CMD INSTALL --no-docs --library="$RUNNER_TEMP/sceptre-library" .

      - name: Run the frozen behavior suite
        run: |
          Rscript --vanilla tools/consistency/consistency.R run \
            --lib "$RUNNER_TEMP/sceptre-library" --tier ${{ matrix.config.tier }}
