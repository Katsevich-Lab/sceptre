# Support checks complement the existing OS matrix and ondisc-absent job.
# These definitions are qualification gates; adding them is not a hosted pass.
name: R-floor
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advertised-r-floor:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # testthat 3.1.8 scopes LC_MESSAGES; a forced LC_ALL would prevent that.
      LC_ALL: ""
      _R_CHECK_FORCE_SUGGESTS_: false
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
          use-public-rspm: false
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install coherent R-floor dependencies and exact testthat floor
        run: Rscript --vanilla tools/hardening/dependencies/install-r-floor-dependencies.R
      - name: Qualify frozen archive in a fresh library without optional ondisc
        run: >-
          python3 tools/qualification/qualify.py --source .
          --output "${{ runner.temp }}/r-floor-qualification" --ondisc absent --check
      - name: Probe exact installed testthat floor and declared namespaces
        shell: bash
        run: |
          export R_LIBS="${{ runner.temp }}/r-floor-qualification/library:${R_LIBS_USER}"
          Rscript --vanilla tools/hardening/dependencies/inventory-testthat.R
          Rscript --vanilla tools/hardening/dependencies/probe-testthat-floor.R
          R_DEFAULT_PACKAGES=NULL Rscript --vanilla tools/hardening/dependencies/probe-declared-namespaces.R
      - name: Retain exact support environment and check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advertised-r-4.1-testthat-3.1.8
          path: |
            ${{ runner.temp }}/r-floor-qualification/receipt.json
            ${{ runner.temp }}/r-floor-qualification/environment.json
            ${{ runner.temp }}/r-floor-qualification/tests.json
            ${{ runner.temp }}/r-floor-qualification/session.txt
            ${{ runner.temp }}/r-floor-qualification/installed.tsv
            ${{ runner.temp }}/r-floor-qualification/git-archive.log
            ${{ runner.temp }}/r-floor-qualification/build.log
            ${{ runner.temp }}/r-floor-qualification/install.log
            ${{ runner.temp }}/r-floor-qualification/tests.log
            ${{ runner.temp }}/r-floor-qualification/check.log
            ${{ runner.temp }}/r-floor-qualification/sceptre.Rcheck/00check.log
            ${{ runner.temp }}/r-floor-qualification/sceptre.Rcheck/tests/testthat.Rout*
            r-floor-dependencies.txt
            r-floor-installed.tsv
